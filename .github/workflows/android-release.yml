# Builds a signed production APK (direct install) and AAB (Google Play) on
# demand: Actions tab -> "Android release build" -> Run workflow.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   PB_UPLOAD_KEYSTORE_BASE64  base64 of credentials/android/purplebox-upload.jks
#   PB_UPLOAD_STORE_PASSWORD   keystorePassword from credentials.json
#   PB_UPLOAD_KEY_ALIAS        keyAlias from credentials.json
#   PB_UPLOAD_KEY_PASSWORD     keyPassword from credentials.json
name: Android release build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Restore upload key
        env:
          PB_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PB_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PB_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::PB_UPLOAD_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$PB_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "PB_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        env:
          PB_UPLOAD_STORE_PASSWORD: ${{ secrets.PB_UPLOAD_STORE_PASSWORD }}
          PB_UPLOAD_KEY_ALIAS: ${{ secrets.PB_UPLOAD_KEY_ALIAS }}
          PB_UPLOAD_KEY_PASSWORD: ${{ secrets.PB_UPLOAD_KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android && ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: purplebox-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
